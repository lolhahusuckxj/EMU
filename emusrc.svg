<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <iframe xmlns="http://www.w3.org/1999/xhtml" id="frame"
            allow="autoplay; fullscreen; gamepad"
            allowfullscreen="true"
            style="width:100%;height:100vh;border:0;background:#000"></iframe>
  </foreignObject>
  <script><![CDATA[
    fetch('index.html')
      .then(function (r) { return r.text(); })
      .then(function (html) {
        document.getElementById('frame').srcdoc = html;
      })
      .catch(function (e) { console.error('Failed to load index.html', e); });
  ]]></script>
</svg>
