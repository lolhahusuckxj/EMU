<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <iframe xmlns="http://www.w3.org/1999/xhtml" id="frame"
            allow="autoplay; fullscreen; gamepad"
            allowfullscreen="true"
            style="width:100%;height:100vh;border:0;background:#000"></iframe>
  </foreignObject>
  <script><![CDATA[
    // raw.githubusercontent.com is always fresh (jsDelivr's @main copy can be stale)
    var SOURCES = [
      'https://raw.githubusercontent.com/lolhahusuckxj/EMU/main/index.html',
      'index.html'
    ];
    function load(i) {
      if (i >= SOURCES.length) {
        document.getElementById('frame').srcdoc =
          '<body style="background:#000;color:#fff;font-family:sans-serif;padding:20px">Could not load index.html</body>';
        return;
      }
      fetch(SOURCES[i])
        .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
        .then(function (html) { document.getElementById('frame').srcdoc = html; })
        .catch(function (e) { console.error('Failed: ' + SOURCES[i], e); load(i + 1); });
    }
    load(0);
  ]]></script>
</svg>
