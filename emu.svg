<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="width:100vw;height:100vh;margin:0;background:#000">
      <div id="game" style="width:100%;height:100%"></div>
      <script><![CDATA[
        window.EJS_player = '#game';
        window.EJS_core = 'gba';
        // Relative path: ROM must sit in the same folder as this SVG
        window.EJS_gameUrl = 'PokemonFireRedPatched.gba';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_pathToData = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = true;
      ]]></script>
      <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
    </div>
  </foreignObject>
</svg>
