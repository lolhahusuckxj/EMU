<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emulator</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #e6e8ee; font-family: system-ui, sans-serif; }
  #menu { max-width: 560px; margin: 0 auto; padding: 32px 20px; }
  h1 { font-size: 22px; margin: 0 0 20px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: #8b92a5; margin: 24px 0 8px; }
  button, select, label.btn { background: #1a1f2b; color: #e6e8ee; border: 1px solid #2c3345; border-radius: 8px; padding: 10px 14px; font-size: 14px; cursor: pointer; }
  button:hover, label.btn:hover { background: #232a3a; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  input[type=file] { display: none; }
  #status { margin-top: 10px; color: #8b92a5; font-size: 13px; min-height: 18px; }
  #go { background: #3b6df0; border-color: #3b6df0; font-weight: 600; }
  #go:disabled { opacity: .4; cursor: default; }
  #game { width: 100%; height: 100%; display: none; }
</style>
</head>
<body>
<div id="menu">
  <h1>Emulator</h1>

  <div id="hostedWrap">
    <h2>Hosted games</h2>
    <div class="row" id="hosted"></div>
  </div>

  <h2>Load a ROM from your device</h2>
  <div class="row">
    <label class="btn" for="rom">Choose ROM</label>
    <input type="file" id="rom">
    <select id="core"></select>
  </div>

  <h2>BIOS (only if the system needs one)</h2>
  <div class="row">
    <label class="btn" for="bios">Choose BIOS</label>
    <input type="file" id="bios">
  </div>

  <div id="status">No ROM selected.</div>
  <div class="row" style="margin-top:16px"><button id="go" disabled>Start</button></div>
</div>
<div id="game"></div>

<script>
// ---- Edit this list to add games that are hosted in your repo ----
var HOSTED_GAMES = [
  { name: 'Pokemon FireRed', core: 'gba', url: 'PokemonFireRedPatched.gba' }
];

var CORES = [
  ['', 'Auto-detect system'],
  ['nes', 'NES / Famicom'], ['snes', 'SNES'], ['n64', 'Nintendo 64'], ['nds', 'Nintendo DS'],
  ['gb', 'Game Boy / Color'], ['gba', 'Game Boy Advance'], ['vb', 'Virtual Boy'],
  ['segaMS', 'Sega Master System'], ['segaMD', 'Sega Genesis / Mega Drive'], ['segaGG', 'Sega Game Gear'],
  ['segaCD', 'Sega CD'], ['segaSaturn', 'Sega Saturn'],
  ['psx', 'PlayStation'], ['atari2600', 'Atari 2600'], ['atari7800', 'Atari 7800'], ['lynx', 'Atari Lynx'],
  ['pce', 'PC Engine / TurboGrafx'], ['ngp', 'Neo Geo Pocket'], ['ws', 'WonderSwan'], ['arcade', 'Arcade (FBNeo)']
];

var EXT = {
  nes:'nes', fds:'nes', unf:'nes', unif:'nes',
  smc:'snes', sfc:'snes', fig:'snes', swc:'snes',
  z64:'n64', n64:'n64', v64:'n64',
  nds:'nds',
  gb:'gb', gbc:'gb',
  gba:'gba',
  vb:'vb', vboy:'vb',
  sms:'segaMS', md:'segaMD', gen:'segaMD', smd:'segaMD', gg:'segaGG',
  pbp:'psx', chd:'psx', cue:'psx', iso:'psx', img:'psx',
  a26:'atari2600', a78:'atari7800', lnx:'lynx',
  pce:'pce', ngp:'ngp', ngc:'ngp', ws:'ws', wsc:'ws'
};

var $ = function (id) { return document.getElementById(id); };
var romFile = null, biosFile = null;

CORES.forEach(function (c) {
  var o = document.createElement('option');
  o.value = c[0]; o.textContent = c[1];
  $('core').appendChild(o);
});

function detect(name) {
  var ext = (name.split('.').pop() || '').toLowerCase();
  return EXT[ext] || '';
}

function refresh() {
  if (!romFile) { $('status').textContent = 'No ROM selected.'; $('go').disabled = true; return; }
  var guess = detect(romFile.name);
  if (guess && !$('core').value) $('core').value = guess;
  var core = $('core').value;
  $('status').textContent = romFile.name + (core ? '  ->  ' + core : '  ->  pick a system');
  $('go').disabled = !core;
}

$('rom').onchange = function (e) {
  romFile = e.target.files[0] || null;
  $('core').value = '';
  refresh();
};
$('bios').onchange = function (e) { biosFile = e.target.files[0] || null; };
$('core').onchange = refresh;

// ---- Auto-detect ROMs in the repo ----
var REPO = 'lolhahusuckxj/EMU', BRANCH = 'main';
var BASE = 'https://cdn.jsdelivr.net/gh/' + REPO + '@' + BRANCH;

function prettyName(file) {
  return file.replace(/\.[^.]+$/, '').replace(/[_\-]+/g, ' ')
             .replace(/([a-z])([A-Z])/g, '$1 $2').trim();
}

function renderHosted(list) {
  $('hosted').innerHTML = '';
  $('hostedWrap').style.display = list.length ? 'block' : 'none';
  list.forEach(function (g) {
    var b = document.createElement('button');
    b.textContent = g.name;
    b.title = g.core;
    b.onclick = function () { start(g.core, g.url, g.name); };
    $('hosted').appendChild(b);
  });
}

renderHosted(HOSTED_GAMES);   // manual list shows first as a fallback

fetch('https://data.jsdelivr.com/v1/package/gh/' + REPO + '@' + BRANCH + '/flat')
  .then(function (r) { return r.json(); })
  .then(function (data) {
    var found = [];
    (data.files || []).forEach(function (f) {
      var file = f.name.split('/').pop();
      var core = detect(file);
      if (core) found.push({ name: prettyName(file), core: core, url: BASE + f.name });
    });
    if (found.length) renderHosted(found);
  })
  .catch(function () { /* keep the manual list */ });

$('go').onclick = function () {
  var core = $('core').value;
  var url = URL.createObjectURL(romFile);
  var name = romFile.name.replace(/\.[^.]+$/, '');
  start(core, url, name);
};

function start(core, url, name) {
  $('menu').style.display = 'none';
  $('game').style.display = 'block';
  window.EJS_player = '#game';
  window.EJS_core = core;
  window.EJS_gameUrl = url;
  window.EJS_gameName = name;
  window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_pathToData = 'https://cdn.emulatorjs.org/stable/data/';
  window.EJS_startOnLoaded = true;
  if (biosFile) window.EJS_biosUrl = URL.createObjectURL(biosFile);
  var s = document.createElement('script');
  s.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
  document.body.appendChild(s);
}
</script>
</body>
</html>
